<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅遊記帳</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent2: #9333ea;
    --green: #16a34a;
    --red: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1f2226;
      --text: #f0f0f0;
      --muted: #9aa0a6;
      --border: #33373d;
      --accent: #5b9bff;
      --accent2: #c084fc;
      --green: #4ade80;
      --red: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 4px;
  }
  .tab {
    flex: 1; background: none; border: none; color: var(--text); opacity: 0.6; font-size: 0.85rem; font-family: inherit;
    padding: 9px 6px; cursor: pointer; border-radius: 8px; transition: background 0.15s, color 0.15s, opacity 0.15s;
  }
  .tab:hover { opacity: 0.85; }
  .tab.active { background: var(--accent); color: #fff; opacity: 1; font-weight: 600; }
  .view { display: none; }
  .view.active { display: block; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  button, .link-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 0.85rem; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px; font-family: inherit;
  }
  button.secondary, .link-btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.personal, .link-btn.personal { background: var(--accent2); }
  button.danger { background: transparent; color: var(--red); padding: 4px 8px; font-size: 0.75rem; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; }
  .total { font-size: 1.6rem; font-weight: 700; }
  .people-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .person { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .person .name { font-weight: 600; margin-bottom: 4px; }
  .person .row { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; }
  .person .net { font-size: 1.05rem; font-weight: 700; margin-top: 4px; }
  .person .value { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
  .net.pos { color: var(--green); }
  .net.neg { color: var(--red); }
  .settle-list { list-style: none; padding: 0; margin: 0; }
  .settle-list li {
    display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .settle-list li:last-child { border-bottom: none; }
  .arrow { color: var(--muted); }
  .amt { margin-left: auto; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .table-scroll { overflow-x: auto; }
  .empty, .error { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
  .error { color: var(--red); }
  .updated { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
  .fx-amount { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .fx-preview { font-size: 0.78rem; color: var(--muted); margin-top: 4px; min-height: 1em; }
  .rate-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .rate-row .field { margin-bottom: 0; max-width: 200px; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card-bg); border-radius: 14px; padding: 20px;
    width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin-top: 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  .checkbox-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .checkbox-grid label {
    display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>旅遊記帳</h1>
  <div class="sub">資料即時同步自 Firebase，大家開這個網頁都能新增消費</div>

  <div class="tabs">
    <button class="tab active" data-view="home">總覽</button>
    <button class="tab" data-view="shared">共同花費</button>
    <button class="tab" data-view="personal">個人花費</button>
  </div>

  <div id="view-home" class="view active">
    <div class="card"><div class="empty">載入中…</div></div>
  </div>

  <div id="view-shared" class="view">
    <div class="toolbar">
      <button class="addSharedBtn">➕ 新增共同花費</button>
    </div>
    <div id="content-shared">
      <div class="card"><div class="empty">載入中…</div></div>
    </div>
  </div>

  <div id="view-personal" class="view">
    <div class="toolbar">
      <button class="addPersonalBtn personal">➕ 新增個人花費</button>
    </div>
    <div id="content-personal">
      <div class="card"><div class="empty">載入中…</div></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="sharedModalBackdrop">
  <div class="modal">
    <h2>新增共同花費</h2>
    <form id="sharedForm">
      <div class="field">
        <label>日期</label>
        <input type="date" id="sDate" required>
      </div>
      <div class="field">
        <label>項目</label>
        <input type="text" id="sItem" placeholder="例如：機票、晚餐" required>
      </div>
      <div class="field">
        <label>幣別</label>
        <select id="sCurrency">
          <option value="JPY" selected>日圓 (¥)</option>
          <option value="TWD">台幣 (NT$)</option>
        </select>
      </div>
      <div class="field">
        <label>金額</label>
        <input type="number" id="sAmount" min="1" step="1" required>
        <div class="fx-preview" id="sAmountPreview"></div>
      </div>
      <div class="field">
        <label>代墊人</label>
        <select id="sPayer" required></select>
      </div>
      <div class="field">
        <label>分攤人</label>
        <div class="checkbox-grid" id="sParticipants"></div>
      </div>
      <div class="field">
        <label>付款方式</label>
        <select id="sMethod">
          <option value="信用卡">信用卡</option>
          <option value="現金">現金</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary sharedCancelBtn">取消</button>
        <button type="submit">送出</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="personalModalBackdrop">
  <div class="modal">
    <h2>新增個人花費</h2>
    <form id="personalForm">
      <div class="field">
        <label>日期</label>
        <input type="date" id="pDate" required>
      </div>
      <div class="field">
        <label>項目</label>
        <input type="text" id="pItem" placeholder="例如：自己買的紀念品" required>
      </div>
      <div class="field">
        <label>幣別</label>
        <select id="pCurrency">
          <option value="JPY" selected>日圓 (¥)</option>
          <option value="TWD">台幣 (NT$)</option>
        </select>
      </div>
      <div class="field">
        <label>金額</label>
        <input type="number" id="pAmount" min="1" step="1" required>
        <div class="fx-preview" id="pAmountPreview"></div>
      </div>
      <div class="field">
        <label>這是誰的花費</label>
        <select id="pOwner" required></select>
      </div>
      <div class="field">
        <label>付款方式</label>
        <select id="pMethod">
          <option value="信用卡">信用卡</option>
          <option value="現金">現金</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary personalCancelBtn">取消</button>
        <button type="submit">送出</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
  // ---- 設定：換其他行程時只要改這裡 ----
  const PEOPLE = ['小鄧', '彥甫', '煒琮', '皇奇'];
  const TRIP_ID = 'japan-2025-12';
  const DEFAULT_JPY_RATE = 0.22; // 台幣/日圓，僅為初始預設值，實際請在「總覽」頁調整成當下匯率

  const firebaseConfig = {
    apiKey: "AIzaSyBY06UvwQKpQUSXcT-_BrU2z1okHaslCB0",
    authDomain: "trip-cost-f402c.firebaseapp.com",
    projectId: "trip-cost-f402c",
    storageBucket: "trip-cost-f402c.firebasestorage.app",
    messagingSenderId: "266690313234",
    appId: "1:266690313234:web:849e1353dbf396644a6ccb"
  };
  // --------------------------------------

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const tripDocRef = db.collection('trips').doc(TRIP_ID);
  const expensesRef = tripDocRef.collection('expenses');

  let currentRate = DEFAULT_JPY_RATE;

  function fmt(n) {
    return Math.round(n).toLocaleString('zh-Hant-TW');
  }
  function currencySymbol(currency) {
    return currency === 'JPY' ? '¥' : 'NT$';
  }

  // ---------- 分頁切換 ----------
  const tabs = document.querySelectorAll('.tab');
  const views = document.querySelectorAll('.view');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      views.forEach(v => v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('view-' + tab.dataset.view).classList.add('active');
    });
  });

  // ---------- 匯率 ----------
  tripDocRef.onSnapshot(doc => {
    const data = doc.data();
    if (data && typeof data.jpyRate === 'number') currentRate = data.jpyRate;
    const rateInput = document.getElementById('rateInput');
    if (rateInput && document.activeElement !== rateInput) rateInput.value = currentRate;
    updateFxPreview('s');
    updateFxPreview('p');
  });

  async function saveRate() {
    const val = Number(document.getElementById('rateInput').value);
    if (!val || val <= 0) {
      alert('請輸入正確的匯率');
      return;
    }
    try {
      await tripDocRef.set({ jpyRate: val }, { merge: true });
    } catch (err) {
      alert('儲存失敗：' + err.message);
    }
  }

  function updateFxPreview(prefix) {
    const currencyEl = document.getElementById(prefix + 'Currency');
    const amountEl = document.getElementById(prefix + 'Amount');
    const previewEl = document.getElementById(prefix + 'AmountPreview');
    if (!currencyEl || !amountEl || !previewEl) return;
    const amount = Number(amountEl.value);
    if (currencyEl.value === 'JPY' && amount > 0) {
      previewEl.textContent = `≈ NT$ ${fmt(amount * currentRate)}（匯率 ${currentRate}）`;
    } else {
      previewEl.textContent = '';
    }
  }

  // ---------- 共同花費表單 ----------
  const sharedModalBackdrop = document.getElementById('sharedModalBackdrop');
  const sharedForm = document.getElementById('sharedForm');
  const sPayer = document.getElementById('sPayer');
  const sParticipants = document.getElementById('sParticipants');
  const sCurrency = document.getElementById('sCurrency');
  const sAmount = document.getElementById('sAmount');

  PEOPLE.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sPayer.appendChild(opt);
  });
  PEOPLE.forEach(name => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = name;
    cb.checked = true;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(name));
    sParticipants.appendChild(label);
  });
  sCurrency.addEventListener('change', () => updateFxPreview('s'));
  sAmount.addEventListener('input', () => updateFxPreview('s'));

  function openSharedModal() {
    document.getElementById('sDate').value = new Date().toISOString().slice(0, 10);
    sharedModalBackdrop.classList.add('open');
  }
  function closeSharedModal() {
    sharedModalBackdrop.classList.remove('open');
    sharedForm.reset();
    updateFxPreview('s');
  }
  document.querySelectorAll('.addSharedBtn').forEach(b => b.addEventListener('click', openSharedModal));
  document.querySelectorAll('.sharedCancelBtn').forEach(b => b.addEventListener('click', closeSharedModal));
  sharedModalBackdrop.addEventListener('click', e => { if (e.target === sharedModalBackdrop) closeSharedModal(); });

  sharedForm.addEventListener('submit', async e => {
    e.preventDefault();
    const participants = Array.from(sParticipants.querySelectorAll('input:checked')).map(cb => cb.value);
    if (participants.length === 0) {
      alert('至少要選一個分攤人');
      return;
    }
    const submitBtn = sharedForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const currency = sCurrency.value;
      const amount = Number(sAmount.value);
      const amountTWD = currency === 'JPY' ? Math.round(amount * currentRate) : amount;
      await expensesRef.add({
        type: 'shared',
        date: document.getElementById('sDate').value,
        item: document.getElementById('sItem').value.trim(),
        currency,
        amount,
        amountTWD,
        rateUsed: currency === 'JPY' ? currentRate : null,
        payer: sPayer.value,
        participants,
        method: document.getElementById('sMethod').value.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      closeSharedModal();
    } catch (err) {
      alert('新增失敗：' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- 個人花費表單 ----------
  const personalModalBackdrop = document.getElementById('personalModalBackdrop');
  const personalForm = document.getElementById('personalForm');
  const pOwner = document.getElementById('pOwner');
  const pCurrency = document.getElementById('pCurrency');
  const pAmount = document.getElementById('pAmount');

  PEOPLE.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    pOwner.appendChild(opt);
  });
  pCurrency.addEventListener('change', () => updateFxPreview('p'));
  pAmount.addEventListener('input', () => updateFxPreview('p'));

  function openPersonalModal() {
    document.getElementById('pDate').value = new Date().toISOString().slice(0, 10);
    personalModalBackdrop.classList.add('open');
  }
  function closePersonalModal() {
    personalModalBackdrop.classList.remove('open');
    personalForm.reset();
    updateFxPreview('p');
  }
  document.querySelectorAll('.addPersonalBtn').forEach(b => b.addEventListener('click', openPersonalModal));
  document.querySelectorAll('.personalCancelBtn').forEach(b => b.addEventListener('click', closePersonalModal));
  personalModalBackdrop.addEventListener('click', e => { if (e.target === personalModalBackdrop) closePersonalModal(); });

  personalForm.addEventListener('submit', async e => {
    e.preventDefault();
    const submitBtn = personalForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const currency = pCurrency.value;
      const amount = Number(pAmount.value);
      const amountTWD = currency === 'JPY' ? Math.round(amount * currentRate) : amount;
      await expensesRef.add({
        type: 'personal',
        date: document.getElementById('pDate').value,
        item: document.getElementById('pItem').value.trim(),
        currency,
        amount,
        amountTWD,
        rateUsed: currency === 'JPY' ? currentRate : null,
        owner: pOwner.value,
        method: document.getElementById('pMethod').value.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      closePersonalModal();
    } catch (err) {
      alert('新增失敗：' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- 刪除 ----------
  async function deleteExpense(id) {
    if (!confirm('確定要刪除這筆消費嗎？')) return;
    try {
      await expensesRef.doc(id).delete();
    } catch (err) {
      alert('刪除失敗：' + err.message);
    }
  }
  window.deleteExpense = deleteExpense;

  function showError(target, msg) {
    document.getElementById(target).innerHTML = `<div class="card"><div class="error">${msg}</div></div>`;
  }

  // ---------- 讀取資料並分流渲染 ----------
  expensesRef.orderBy('createdAt', 'asc').onSnapshot(
    snapshot => {
      const all = snapshot.docs.map(doc => {
        const data = doc.data();
        const currency = data.currency || 'TWD';
        const amountTWD = typeof data.amountTWD === 'number' ? data.amountTWD : data.amount;
        return { id: doc.id, ...data, currency, amountTWD };
      });
      const shared = all.filter(e => e.type !== 'personal');
      const personal = all.filter(e => e.type === 'personal');
      renderHome(shared, personal);
      renderShared(shared);
      renderPersonal(personal);
    },
    err => {
      showError('view-home', '無法讀取資料：' + err.message);
      showError('content-shared', '無法讀取資料：' + err.message);
      showError('content-personal', '無法讀取資料：' + err.message);
    }
  );

  function fmtAmountCell(e) {
    if (e.currency === 'JPY') {
      return `¥ ${fmt(e.amount)}<div class="fx-amount">≈NT$ ${fmt(e.amountTWD)}</div>`;
    }
    return `NT$ ${fmt(e.amountTWD)}`;
  }

  // ---------- 總覽 ----------
  function renderHome(shared, personal) {
    const sharedTotal = shared.reduce((s, e) => s + e.amountTWD, 0);
    const personalTotal = personal.reduce((s, e) => s + e.amountTWD, 0);
    const grandTotal = sharedTotal + personalTotal;

    document.getElementById('view-home').innerHTML = `
      <div class="card">
        <h2>總花費</h2>
        <div class="total">NT$ ${fmt(grandTotal)}</div>
      </div>
      <div class="people-grid">
        <div class="person">
          <div class="name">共同花費</div>
          <div class="value">NT$ ${fmt(sharedTotal)}</div>
        </div>
        <div class="person">
          <div class="name">個人花費</div>
          <div class="value">NT$ ${fmt(personalTotal)}</div>
        </div>
      </div>
      <div class="toolbar" style="margin-top: 16px;">
        <button class="addSharedBtn">➕ 新增共同花費</button>
        <button class="addPersonalBtn personal">➕ 新增個人花費</button>
      </div>
      <div class="card">
        <h2>日圓匯率設定</h2>
        <div class="sub">記帳時可以直接輸入日圓金額，會依這裡設定的匯率自動換算成台幣</div>
        <div class="rate-row">
          <div class="field">
            <label>1 日圓 = ? 台幣</label>
            <input type="number" id="rateInput" step="0.001" min="0.001" value="${currentRate}">
          </div>
          <button class="secondary" id="saveRateBtn" type="button">儲存匯率</button>
        </div>
      </div>
    `;
    document.querySelectorAll('#view-home .addSharedBtn').forEach(b => b.addEventListener('click', openSharedModal));
    document.querySelectorAll('#view-home .addPersonalBtn').forEach(b => b.addEventListener('click', openPersonalModal));
    document.getElementById('saveRateBtn').addEventListener('click', saveRate);
  }

  // ---------- 共同花費頁 ----------
  function renderShared(expenses) {
    const container = document.getElementById('content-shared');
    if (expenses.length === 0) {
      container.innerHTML = '<div class="card"><div class="empty">目前還沒有任何共同花費，點上面「新增共同花費」開始記帳吧！</div></div>';
      return;
    }

    const paid = {}, owed = {};
    PEOPLE.forEach(name => { paid[name] = 0; owed[name] = 0; });

    expenses.forEach(e => {
      // 均分後除不盡的零頭（1 元為單位）依序分給前幾位分攤人，
      // 讓每一筆消費的分攤金額加總起來一定等於原始金額，不會有無法追蹤的零頭。
      const ordered = PEOPLE.filter(name => e.participants.includes(name));
      const n = ordered.length;
      const base = n ? Math.floor(e.amountTWD / n) : 0;
      const remainder = n ? e.amountTWD - base * n : 0;
      const shareMap = {};
      ordered.forEach((name, idx) => {
        shareMap[name] = base + (idx < remainder ? 1 : 0);
      });
      e.shareMap = shareMap;
      e.orderedParticipants = ordered;
      ordered.forEach(name => { owed[name] = (owed[name] || 0) + shareMap[name]; });
      if (e.payer) paid[e.payer] = (paid[e.payer] || 0) + e.amountTWD;
    });

    const totalSpent = expenses.reduce((s, e) => s + e.amountTWD, 0);
    const net = {};
    PEOPLE.forEach(name => { net[name] = (paid[name] || 0) - (owed[name] || 0); });

    const settlements = settleDebts(net);

    container.innerHTML = `
      ${cardTotal(totalSpent, expenses.length)}
      ${cardPeople(paid, owed, net)}
      ${cardSettlement(settlements)}
      ${cardSharedExpenses(expenses)}
      <div class="updated">即時同步中，最後更新：${new Date().toLocaleTimeString('zh-Hant-TW')}</div>
    `;
  }

  function cardTotal(total, count) {
    return `
      <div class="card">
        <h2>共同花費總額</h2>
        <div class="total">NT$ ${fmt(total)}</div>
        <div class="sub">共 ${count} 筆消費</div>
      </div>`;
  }

  function cardPeople(paid, owed, net) {
    const items = PEOPLE.map(name => {
      const n = net[name] || 0;
      const cls = n > 0.5 ? 'pos' : (n < -0.5 ? 'neg' : '');
      const netText = n > 0.5 ? `應收回 NT$ ${fmt(n)}` : (n < -0.5 ? `應付出 NT$ ${fmt(-n)}` : '已結清');
      return `
        <div class="person">
          <div class="name">${name}</div>
          <div class="row"><span>已代墊</span><span>NT$ ${fmt(paid[name] || 0)}</span></div>
          <div class="row"><span>應分攤</span><span>NT$ ${fmt(owed[name] || 0)}</span></div>
          <div class="net ${cls}">${netText}</div>
        </div>`;
    }).join('');
    return `<div class="card"><h2>個人餘額</h2><div class="people-grid">${items}</div></div>`;
  }

  function cardSettlement(settlements) {
    if (settlements.length === 0) {
      return `<div class="card"><h2>建議轉帳</h2><div class="empty">大家都結清了 🎉</div></div>`;
    }
    const items = settlements.map(s => `
      <li>
        <span>${s.from}</span>
        <span class="arrow">→</span>
        <span>${s.to}</span>
        <span class="amt">NT$ ${fmt(s.amount)}</span>
      </li>`).join('');
    return `<div class="card"><h2>建議轉帳（最少筆數結清）</h2><ul class="settle-list">${items}</ul></div>`;
  }

  function cardSharedExpenses(expenses) {
    const rows = expenses.slice().reverse().map(e => {
      const breakdown = e.orderedParticipants
        .map(name => `${name} NT$${fmt(e.shareMap[name])}`)
        .join('、') || '-';
      return `
      <tr>
        <td>${e.date || ''}</td>
        <td>${e.item}</td>
        <td>${fmtAmountCell(e)}</td>
        <td>${e.payer}</td>
        <td>${breakdown}</td>
        <td>${e.method || ''}</td>
        <td><button class="danger" onclick="deleteExpense('${e.id}')">刪除</button></td>
      </tr>`;
    }).join('');
    return `
      <div class="card">
        <h2>消費明細</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>日期</th><th>項目</th><th>金額</th><th>代墊人</th><th>分攤明細</th><th>付款方式</th><th></th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  function settleDebts(net) {
    const creditors = [];
    const debtors = [];
    Object.keys(net).forEach(name => {
      const v = net[name];
      if (v > 0.5) creditors.push({ name, amt: v });
      else if (v < -0.5) debtors.push({ name, amt: -v });
    });
    creditors.sort((a, b) => b.amt - a.amt);
    debtors.sort((a, b) => b.amt - a.amt);

    const result = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const pay = Math.min(debtors[i].amt, creditors[j].amt);
      if (pay > 0.5) {
        result.push({ from: debtors[i].name, to: creditors[j].name, amount: pay });
      }
      debtors[i].amt -= pay;
      creditors[j].amt -= pay;
      if (debtors[i].amt < 1) i++;
      if (creditors[j].amt < 1) j++;
    }
    return result;
  }

  // ---------- 個人花費頁 ----------
  function renderPersonal(expenses) {
    const container = document.getElementById('content-personal');
    if (expenses.length === 0) {
      container.innerHTML = '<div class="card"><div class="empty">目前還沒有任何個人花費，點上面「新增個人花費」開始記帳吧！</div></div>';
      return;
    }

    const total = expenses.reduce((s, e) => s + e.amountTWD, 0);

    const rows = expenses.slice().reverse().map(e => `
      <tr>
        <td>${e.date || ''}</td>
        <td>${e.item}</td>
        <td>${fmtAmountCell(e)}</td>
        <td>${e.owner || ''}</td>
        <td>${e.method || ''}</td>
        <td><button class="danger" onclick="deleteExpense('${e.id}')">刪除</button></td>
      </tr>`).join('');

    container.innerHTML = `
      <div class="card">
        <h2>個人花費總額</h2>
        <div class="total">NT$ ${fmt(total)}</div>
        <div class="sub">共 ${expenses.length} 筆消費</div>
      </div>
      <div class="card">
        <h2>個人花費明細</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>日期</th><th>項目</th><th>金額</th><th>本人</th><th>付款方式</th><th></th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      <div class="updated">即時同步中，最後更新：${new Date().toLocaleTimeString('zh-Hant-TW')}</div>
    `;
  }
</script>
</body>
</html>
